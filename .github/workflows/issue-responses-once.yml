name: answer-tracked-issues

on:
  push:
    branches:
      - main

permissions:
  issues: write

jobs:
  answer:
    # This workflow is intentionally one-shot. Remove it after the tagged
    # issue audit has completed so ordinary main pushes never post comments.
    if: "${{ github.event.head_commit.message == 'docs: publish issue responses' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Post idempotent release-status replies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          marker='<!-- anti-api-v3.2.0-issue-response -->'

          post() {
            local number="$1"
            if gh issue view "$number" --repo "$repo" --comments --json comments --jq '.comments[].body' | grep -Fq "$marker"; then
              echo "Issue #$number already has the v3.2.0 response marker; skipping."
              return 0
            fi
            gh issue comment "$number" --repo "$repo" --body-file -
          }

          post 25 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 状态更新

          已加入日志级别环境变量：`ANTI_API_LOG_LEVEL=error|warn|info|debug`，也可用 `ANTI_API_DEBUG=1` 临时提高详细度。默认保持 error 级别；日志会清洗凭证和上游响应正文。Docker 容器请在启动时传入该变量后重试。

          这是配置和日志行为的修复，尚未用你的具体部署做在线复现。若仍看不到信息，请补充运行方式、请求路径、provider/model 和脱敏后的日志。
          EOF

          post 24 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          OpenAI `image_url` parts are now preserved through `/v1/chat/completions` and `/v1/messages` conversions. Inline base64 and remote `http(s)` images are validated, bounded, and SSRF-protected; unsupported schemes, private targets, malformed base64, and oversized images are rejected with a clear validation error.

          Please retry on v3.2.0. If it still reproduces, include the provider, model, endpoint, and a redacted request shape (never the image data or credentials).
          EOF

          post 23 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Windows OAuth/browser launching now uses the native platform command (`start`) without assuming an `open` executable. The same path uses `open` on macOS and `xdg-open` on Linux, with `ANTI_API_NO_OPEN=1` / `ANTI_API_OAUTH_NO_OPEN=1` for headless runs.

          Please retry the current Windows package. If the browser still does not open, report the launch mode and sanitized console output; the login URL can also be opened manually.
          EOF

          post 20 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Gemini 3.1 model aliases and request encoding were updated. The generation config now omits the legacy safety enum for Gemini 3.1 and caps the output token field to the provider-supported limit; aliases map to the current Antigravity model IDs.

          This is covered by compatibility tests, but live provider availability still depends on the signed-in Antigravity account and client version. Please retry on v3.2.0 and include the model ID plus a redacted error if it remains `INVALID_ARGUMENT`.
          EOF

          post 19 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Zed remains supported through explicit credential import. Set `ANTI_API_ZED_CREDENTIALS_FILE` to an owner-only JSON file and use `Add Account -> Zed`; Anti-API does not scan `Zed.app`, Keychain, or another app's database. The hosted endpoints are fixed to `zed.dev` and `cloud.zed.dev`, and an expired source token must be re-imported.

          Remote Linux/Docker use is supported when the authorized credential file is copied into that host securely. We have not run a live request with your account, so please include platform, import result, model, and a redacted error if it still fails.
          EOF

          post 18 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Zed credentials are intentionally imported explicitly; the application no longer depends on finding `Zed.app` under `/Applications`. Set `ANTI_API_ZED_CREDENTIALS_FILE` to an absolute, owner-only JSON file (maximum 64 KiB), then choose `Add Account -> Zed`. This also works on Linux/Docker with a securely copied authorized file.

          Automatic Keychain/app-database discovery is not supported by design. If explicit import fails, please provide the non-sensitive diagnostics result and platform.
          EOF

          post 16 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Anti-API is an unofficial interoperability proxy and cannot guarantee that an account will never be restricted. Provider terms, account plans, traffic, and endpoint policy are outside this project’s control. Use only accounts you own or are authorized to administer, keep provider security controls enabled, and review the current terms before using any integration.

          v3.2.0 adds clearer scope/security documentation and keeps credentials, management routes, and logs behind local/token-gated boundaries; that is risk reduction, not a ban guarantee.
          EOF

          post 15 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Codex reasoning effort is supported with `ANTI_API_CODEX_REASONING_EFFORT=low|medium|high` (default `medium`). Requests to `/v1/chat/completions` may also send `reasoning_effort` or `reasoning.effort`; the value is normalized before routing.

          The setting applies to Codex-compatible routes only. If a client still ignores it, please include the request field, selected model, and a redacted response.
          EOF

          post 14 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Antigravity login now validates PKCE/state, binds the loopback callback to the login session, refreshes the public IDE version manifest with a safe fallback, and sanitizes OAuth errors. `ANTIGRAVITY_IDE_VERSION` can pin a known-good client version; `ANTI_API_DISABLE_ANTIGRAVITY_VERSION_REFRESH=1` disables refresh when required by a restricted environment.

          Please retry the current release from a clean login session. If it remains stuck, include OS, install method, callback port, and sanitized diagnostics; do not paste tokens or callback URLs containing credentials.
          EOF

          post 12 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Antigravity now refreshes its public client-version manifest periodically and falls back safely when the manifest is unavailable. Set `ANTIGRAVITY_IDE_VERSION` to pin a known-good version, or `ANTI_API_DISABLE_ANTIGRAVITY_VERSION_REFRESH=1` to disable the check in a controlled environment.

          Please retry on v3.2.0 and include the client/version and sanitized error if the provider still reports that the IDE is unsupported. Live provider acceptance remains account- and rollout-dependent.
          EOF

          post 11 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          GitHub Copilot routing now normalizes model IDs, refreshes the per-account model list with a static fallback, and applies cooldown-aware handling for transient 404/429 responses. Unsupported model aliases are rejected before they are sent upstream.

          Please retry with a current model from `/v1/models` on v3.2.0. If an error remains, include the exact model ID, account/provider, HTTP status, and a redacted response; later model rollouts may change availability.
          EOF

          post 8 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Amazon Kiro is supported in the current release: authorized account import, quota visibility, model routing, reverse-proxy completion, tool/image handling, and request cancellation are included. Local credential sources can be imported explicitly through the diagnostics/account flow; no credentials are copied without an explicit user action.

          Kiro access and model availability still depend on the signed-in account and region. Please include the import source, region, model, and sanitized error if you need a follow-up.
          EOF

          post 6 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Startup no longer requires an IDE language-server process or port probe. The quota/account diagnostics panel now reports missing CLI tools, credential sources, callback ports, and provider configuration without making the proxy depend on a language-server port.

          Please retry on v3.2.0. If the message persists, include the provider, install method, and sanitized diagnostics output.
          EOF

          post 5 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          The Windows launcher keeps the console open when startup fails, so the error is visible; set `ANTI_API_NO_PAUSE=1` only for unattended scripts. The release also includes a portable Windows bundle and adjacent SHA-256 checksum files.

          Please retry the current `start.bat`/portable package. If it still exits, include the visible error and Windows version, with paths and credentials redacted.
          EOF

          post 3 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Remote inference is now a separate, inference-only gateway (default port `8966`) and requires `ANTI_API_PUBLIC_TOKEN`. The dashboard, account management, logs, settings, and updater remain loopback-only or control-token protected. OAuth callbacks stay loopback-bound; use SSH forwarding or Copilot’s device flow on a remote host.

          This supports authorized remote API clients, not an unauthenticated public dashboard. Please include the gateway status, host binding, and a sanitized HTTP response if your setup still fails.
          EOF

          post 2 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Model switching is supported through Flow Routing (`route:<name>`) and Account Routing for provider-native model IDs. The dashboard exposes account order and Smart Switch; model lists are fetched per account when possible, with safe fallbacks, and the sticky cursor advances through the configured chain.

          Please retry with the exact model ID shown by `/v1/models` and include the routing configuration shape (without account IDs or tokens) if switching still selects the wrong account.
          EOF

          post 1 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          Request handling now bounds bodies and streams, propagates client cancellation to upstream requests, handles malformed SSE safely, and keeps upstream response bodies out of logs. Use the provider-compatible endpoint (`/v1/chat/completions` or `/v1/messages`) with a valid local client token; remote inference additionally requires `ANTI_API_PUBLIC_TOKEN`.

          Please retry on v3.2.0. If the network error remains, include provider, model, endpoint, HTTP status, and sanitized logs; never include credentials, cookies, or full upstream URLs.
          EOF

          post 7 <<'EOF'
          <!-- anti-api-v3.2.0-issue-response -->
          ### v3.2.0 status update

          The current Antigravity model inventory includes `gpt-oss-120b` when the signed-in account exposes it; model availability is account/provider dependent and should be checked with `/v1/models`. If the account returns an unsupported-model response, use one of the models advertised for that account or provide the exact response for compatibility work.
          EOF
